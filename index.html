<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315f46"><title>Essensplanung</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="print.css"></head><body>
<header class="appHeader"><div><small>MEAL PLANNER</small><h1>Essensplanung</h1></div><nav><button id="dashboardBtn">Dashboard</button><button id="cookbookBtn">Kochbuch</button><button id="shoppingBtn">Einkaufsliste</button><button id="printWeekBtn">Drucken</button></nav></header>
<main><section class="toolbar"><div class="nav"><button id="prevBtn">‹</button><button id="todayBtn">Heute</button><button id="nextBtn">›</button></div><div class="period"><h2 id="periodTitle"></h2><p id="periodSubtitle"></p></div><div class="views"><button data-view="week" class="active">Woche</button><button data-view="month">Monat</button></div></section><section id="dashboard" hidden></section><section id="calendar" class="calendar week"></section></main>
<dialog id="mealDialog"><form id="mealForm"><div class="dialogHead"><div><small>TAGESPLAN</small><h2 id="mealDate"></h2></div><button type="button" data-close="mealDialog">×</button></div><label>Gericht<input id="mealTitle" required autocomplete="off"></label><div id="suggestions" class="suggestions" hidden></div><label>Notiz<textarea id="mealNote" rows="3"></textarea></label><fieldset><legend>Kategorie</legend><div id="categoryOptions" class="categories"></div></fieldset><section id="moveSection" class="moveSection" hidden><strong>Gericht verschieben</strong><input id="moveDate" type="date"><button id="moveBtn" type="button">Verschieben</button></section><div class="actions"><button id="deleteMealBtn" type="button" class="danger">Löschen</button><span></span><button type="button" data-close="mealDialog">Abbrechen</button><button class="primary">Speichern</button></div></form></dialog>
<dialog id="cookbookDialog" class="wideDialog"><div class="dialogShell"><div class="dialogHead"><div><small>MEINE GERICHTE</small><h2>Kochbuch</h2></div><button type="button" data-close="cookbookDialog">×</button></div><input id="cookbookSearch" type="search" placeholder="Gerichte durchsuchen …"><div id="cookbookFilters" class="filters"></div><div id="cookbookList" class="list"></div><nav id="cookbookPages" class="pages"></nav></div></dialog>
<dialog id="planDialog"><form id="planForm"><div class="dialogHead"><h2 id="planTitle"></h2><button type="button" data-close="planDialog">×</button></div><label>Tag<input id="planDate" type="date" required></label><div class="actions"><span></span><button type="button" data-close="planDialog">Abbrechen</button><button class="primary">Einplanen</button></div></form></dialog>
<dialog id="shoppingDialog" class="wideDialog"><div class="dialogShell"><div class="dialogHead"><div><small>EINKAUF</small><h2>Einkaufsliste</h2></div><button type="button" data-close="shoppingDialog">×</button></div><div class="shoppingToolbar"><button id="newShoppingBtn" class="primary">+ Neuer Eintrag</button><button id="printShoppingBtn">Drucken</button><button id="clearShoppingBtn" class="danger">Alle löschen</button></div><form id="shoppingForm" class="shoppingForm" hidden><input id="shoppingName" placeholder="Artikel" required><input id="shoppingAmount" placeholder="Anzahl / Menge"><button type="button" id="cancelShoppingBtn">Abbrechen</button><button class="primary">Speichern</button></form><div id="shoppingList" class="list"></div></div></dialog>
<section id="shoppingPrint" class="shoppingPrint"><h1>Einkaufsliste</h1><div id="shoppingPrintList"></div></section><div id="toast"></div><script src="app.js"></script></body></html>
